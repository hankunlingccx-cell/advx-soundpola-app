name: soundpola
description: SoundPola — 声音记忆收藏 App（first.md / designstyle.md）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  go_router: ^16.0.0
  record: ^6.0.0
  permission_handler: ^12.0.0
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  nfc_manager: ^4.0.2
  ndef_record: ^1.4.2
  android_intent_plus: ^5.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  http: ^1.6.0
  app_links: ^6.3.0
  web3dart: ^2.7.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  mobile_scanner: ^7.4.0
  image: ^4.8.0
  file_picker: 10.3.8
  flutter_quick_video_encoder: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/disc_textures/
    - assets/beats/
