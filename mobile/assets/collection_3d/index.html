<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SoundPola Collection 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #c {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      pointer-events: none;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #F4F7F6;
      opacity: 0;
      transition: opacity 220ms ease;
    }
    #hud.visible { opacity: 1; }
    #hud .name {
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }
    #hud .meta {
      margin-top: 4px;
      font-size: 12px;
      color: #A5AFAC;
    }
    #hud .pos {
      margin-top: 6px;
      font-size: 11px;
      color: #63E0CB;
      letter-spacing: 0.04em;
    }
    #boot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #68736F;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="boot">初始化收藏柜…</div>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="name" id="hudName"></div>
    <div class="meta" id="hudMeta"></div>
    <div class="pos" id="hudPos"></div>
  </div>
  <script src="js/three.min.js"></script>
  <script src="js/collection_scene.js"></script>
</body>
</html>
